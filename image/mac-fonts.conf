<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Generic families resolved the way Chrome on a Mac resolves them, from the Mac's
  own fonts that docker-compose.mac.yml mounts. Without this, fontconfig answers
  with whatever Linux prefers and a page measuring `monospace` or `system-ui`
  gets widths no Mac produces. Measured against Chrome 154 on macOS: monospace is
  Menlo, cursive Apple Chancery, fantasy Papyrus, and system-ui and
  BlinkMacSystemFont the San Francisco system font (".SF NS" here).
  stealthbox-serve installs this only for the macOS persona.
-->
<fontconfig>
  <alias binding="strong"><family>monospace</family><prefer><family>Menlo</family></prefer></alias>
  <alias binding="strong"><family>cursive</family><prefer><family>Apple Chancery</family></prefer></alias>
  <alias binding="strong"><family>fantasy</family><prefer><family>Papyrus</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>.SF NS</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family><prefer><family>.SF NS</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Helvetica</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Times</family></prefer></alias>
  <!-- Only the Mac's fonts: the image's own (Liberation, Noto, URW, croscore)
       answered text fallback, so kana, emoji and Hebrew came from fonts no Mac
       has. Measured: with these gone, kana measure as on the Mac (80 px for five
       at 16px) and emoji come from Apple Color Emoji. -->
  <selectfont><rejectfont><glob>/usr/share/fonts/*</glob></rejectfont></selectfont>
  <!-- CoreText does not hint; render outlines as they are. -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
