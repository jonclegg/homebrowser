[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stealthbox-launcher"
version = "1.0.0"
description = "Browser arguments, proxy and GeoIP handling for Stealthbox's cdp-server"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "geoip2>=4.0",
    "socksio>=1.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["stealthbox_launcher"]
